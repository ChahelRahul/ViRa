<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Victoria & Rahul</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cardo&family=Mirza&family=Great+Vibes&display=swap"
    rel="stylesheet">

  <style>
    body {
      background: url('./assets/images/Home.png') no-repeat center center fixed;
      background-size: cover;
      background-color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(2px);
      font-family: 'Cardo', serif;
      margin: 0;
      padding: 2rem;
      color: white;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #B27409;
      margin: 0;
      text-align: center;
    }

    .content-wrapper {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      padding: 2rem;
      max-width: 1000px;
      margin: 2rem auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .navbar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      background-color: #000000;
      padding: 1rem;
    }

    .navbar a {
      font-family: 'Mirza', cursive;
      text-transform: uppercase;
      text-decoration: none;
      color: #B27409;
      font-size: 1rem;
      font-weight: bold;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    .navbar a:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .gallery {
      display: none; /* Initially hidden until loaded */
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    .loader-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      margin-top: 2rem;
    }

    .cat-loader {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 5px #00000088);
    }

    footer {
      background-color: #000000BF;
      padding: 1rem;
      font-size: 0.9rem;
      color: white;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div id="nav-placeholder"></div>
  <script>
    fetch('navbar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
      });
  </script>

  <div class="content-wrapper">
    <h1>Our Gallery</h1>

    <div class="loader-wrapper" id="loader">
      <img src="./assets/images/cat-spinner.gif" alt="Loading..." class="cat-loader" />
    </div>

    <div class="gallery" id="gallery">
      <img src="./assets/images/gallery/IMG_0006.JPG" alt="IMG_0006" loading="lazy">
      <img src="./assets/images/gallery/IMG_3556.jpg" alt="IMG_3556" loading="lazy">
      <!-- Add more images here -->
    </div>

    <footer>
      <p>With love, Victoria & Rahul</p>
    </footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById("loader");
      const gallery = document.getElementById("gallery");

      // Simulate loading time
      setTimeout(() => {
        loader.style.display = "none";
        gallery.style.display = "grid";
      }, 500);
    });
  </script>

</body>

</html>
