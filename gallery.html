<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gallery | Victoria & Rahul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Mirza&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('./assets/images/Pages.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 2rem;
      background-color: #fff9f9;
      color: white;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #B27409;
      margin: 0;
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: none; /* Initially hidden */
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    .loader-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      margin-top: 2rem;
    }

    .cat-loader {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 5px #00000088);
    }

    .error-message {
      text-align: center;
      color: red;
      font-family: 'Mirza', cursive;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1>Our Gallery</h1>

  <div class="loader-wrapper" id="loader">
    <img src="./assets/images/cat-spinner.gif" alt="Loading..." class="cat-loader" />
  </div>

  <div class="error-message" id="error"></div>

  <div class="gallery" id="gallery"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById("loader");
      const container = document.getElementById("gallery");
      const errorBox = document.getElementById("error");

      fetch("/list_photos")
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          return res.json();
        })
        .then(images => {
          if (!Array.isArray(images) || images.length === 0) {
            errorBox.textContent = "No photos available at the moment.";
            loader.style.display = "none";
            return;
          }

          images.forEach((img, i) => {
            const image = document.createElement("img");
            image.src = img.url;
            image.alt = img.filename;
            image.loading = "lazy"; // Improves performance
            image.onerror = () => image.remove(); // Skip broken images
            container.appendChild(image);
          });

          loader.style.display = "none";
          container.style.display = "grid";
        })
        .catch(err => {
          loader.style.display = "none";
          errorBox.textContent = "⚠️ Failed to load photos.";
          console.error("Gallery fetch error:", err);
        });
    });
  </script>

</body>
</html>
