<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gallery | Victoria & Rahul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Mirza&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('./assets/images/Pages.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 2rem;
      background-color: #fff9f9;
      color: white;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #B27409;
      margin: 0;
      text-align: center;
    }

    .gallery {
      display: none; /* Initially hidden */
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    .loader-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      margin-top: 2rem;
    }

    .cat-loader {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 5px #00000088);
    }
  </style>
</head>
<body>

  <h1>Our Gallery</h1>

  <div class="loader-wrapper" id="loader">
    <img src="./assets/images/cat-spinner.gif" alt="Loading..." class="cat-loader" />
  </div>

  <div class="gallery" id="gallery">
    <img src="./assets/images/gallery/IMG_0006.JPG" alt="IMG_0006" loading="lazy">
    <img src="./assets/images/gallery/IMG_3556.jpg" alt="IMG_3556" loading="lazy">
    <!-- The following HEIC images won't display unless converted -->
    <!-- <img src="./assets/images/gallery/IMG_4242.HEIC" alt="IMG_4242" loading="lazy"> 
    <img src="./assets/images/gallery/IMG_4372.heic" alt="IMG_4372" loading="lazy"> 
    <img src="./assets/images/gallery/IMG_4506.HEIC" alt="IMG_4506" loading="lazy"> 
    <img src="./assets/images/gallery/IMG_4571.HEIC" alt="IMG_4571" loading="lazy"> 
    <img src="./assets/images/gallery/IMG_4592.heic" alt="IMG_4592" loading="lazy"> 
     <img src="./assets/images/gallery/IMG_5286.heic" alt="IMG_5286" loading="lazy"> -->
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById("loader");
      const gallery = document.getElementById("gallery");

      // Simulate image loading
      const images = gallery.querySelectorAll("img");
      let loadedCount = 0;

      images.forEach(img => {
        img.onload = () => {
          loadedCount++;
          if (loadedCount === images.length) {
            loader.style.display = "none";
            gallery.style.display = "grid";
          }
        };
        img.onerror = () => {
          loadedCount++;
          if (loadedCount === images.length) {
            loader.style.display = "none";
            gallery.style.display = "grid";
          }
        };
      });

      // If no images, hide loader immediately
      if (images.length === 0) {
        loader.style.display = "none";
        gallery.style.display = "grid";
      }
    });
  </script>

</body>
</html>
